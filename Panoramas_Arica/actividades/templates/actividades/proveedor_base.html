{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block titulo %}Portal proveedor{% endblock %} · Panoramas Arica</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'style.css' %}">
  <link rel="stylesheet" href="{% static 'actividades/proveedor.css' %}">
</head>
<body class="proveedor-body">
  <header class="proveedor-header">
    <a href="{% url 'actividades:panel' %}" class="proveedor-header__logo" aria-label="Ir al panel">
      <img src="{% static 'actividades/img/logo-panel.png' %}" alt="Panoramas Arica">
    </a>

    {% firstof request.user.first_name request.user.email as nombre_cuenta %}
    <div class="proveedor-header__cuenta">
      <div class="text-end">
        <div class="proveedor-header__org">{{ nombre_cuenta }}</div>
        <small class="text-muted">Cuenta proveedor</small>
      </div>
      <form method="post" action="{% url 'cuentas:salir' %}" class="proveedor-header__salir">
        {% csrf_token %}
        <button type="submit" class="btn-fila">Cerrar sesión</button>
      </form>
    </div>
  </header>

  <main class="proveedor-main">
    {% block contenido %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
